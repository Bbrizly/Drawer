name: iOS

on:
  push:
    branches:
      - main
      - ios-companion
      - ios-storage-hardening
    paths:
      - "iOS/**"
      - "Sources/DrawerCore/**"
      - "Tests/DrawerCoreTests/**"
      - "Package.swift"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "iOS/**"
      - "Sources/DrawerCore/**"
      - "Tests/DrawerCoreTests/**"
      - "Package.swift"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Shared core tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: swift test

  macos-regression:
    name: macOS Drawer release package
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build and package existing macOS app
        run: make app
      - name: Verify packaged app signature
        run: codesign --verify --strict --verbose=2 Drawer.app

  ios-release-gate:
    name: iOS app, widget and release
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Validate Apple metadata
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint \
            iOS/DrawerMobile/Resources/Info.plist \
            iOS/DrawerMobile/Resources/DrawerMobile.entitlements \
            iOS/DrawerMobile/Resources/PrivacyInfo.xcprivacy \
            iOS/DrawerWidgets/Resources/Info.plist \
            iOS/DrawerWidgets/Resources/DrawerWidgets.entitlements \
            iOS/DrawerWidgets/Resources/PrivacyInfo.xcprivacy

          python3 - <<'PY'
          import plistlib

          expected_group = ["group.com.bbrizly.drawer"]
          entitlement_paths = [
              "iOS/DrawerMobile/Resources/DrawerMobile.entitlements",
              "iOS/DrawerWidgets/Resources/DrawerWidgets.entitlements",
          ]
          for path in entitlement_paths:
              with open(path, "rb") as handle:
                  payload = plistlib.load(handle)
              actual = payload.get("com.apple.security.application-groups")
              if actual != expected_group:
                  raise SystemExit(f"{path}: expected App Group {expected_group}, found {actual}")

          privacy_paths = [
              "iOS/DrawerMobile/Resources/PrivacyInfo.xcprivacy",
              "iOS/DrawerWidgets/Resources/PrivacyInfo.xcprivacy",
          ]
          for path in privacy_paths:
              with open(path, "rb") as handle:
                  payload = plistlib.load(handle)
              if payload.get("NSPrivacyTracking") is not False:
                  raise SystemExit(f"{path}: Drawer must declare tracking disabled")
              if payload.get("NSPrivacyCollectedDataTypes") != []:
                  raise SystemExit(f"{path}: unexpected collected-data declaration")
              api_types = payload.get("NSPrivacyAccessedAPITypes", [])
              user_defaults = next(
                  (entry for entry in api_types
                   if entry.get("NSPrivacyAccessedAPIType") == "NSPrivacyAccessedAPICategoryUserDefaults"),
                  None,
              )
              reasons = set((user_defaults or {}).get("NSPrivacyAccessedAPITypeReasons", []))
              if "1C8F.1" not in reasons:
                  raise SystemExit(f"{path}: App Group UserDefaults use must declare reason 1C8F.1")

          with open("iOS/DrawerMobile/Resources/Info.plist", "rb") as handle:
              app_info = plistlib.load(handle)
          if app_info.get("NSSupportsLiveActivities") is not True:
              raise SystemExit("DrawerMobile Info.plist must enable Live Activities")
          schemes = {
              scheme
              for entry in app_info.get("CFBundleURLTypes", [])
              for scheme in entry.get("CFBundleURLSchemes", [])
          }
          if "drawer" not in schemes:
              raise SystemExit("DrawerMobile Info.plist must register the drawer URL scheme")

          with open("iOS/DrawerWidgets/Resources/Info.plist", "rb") as handle:
              widget_info = plistlib.load(handle)
          extension_point = widget_info.get("NSExtension", {}).get("NSExtensionPointIdentifier")
          if extension_point != "com.apple.widgetkit-extension":
              raise SystemExit(f"Unexpected widget extension point: {extension_point}")
          PY

          ICON="iOS/DrawerMobile/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          ICON_WIDTH="$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/ { print $2 }')"
          ICON_HEIGHT="$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/ { print $2 }')"
          ICON_ALPHA="$(sips -g hasAlpha "$ICON" | awk '/hasAlpha/ { print $2 }')"
          [[ "$ICON_WIDTH" == "1024" && "$ICON_HEIGHT" == "1024" ]]
          [[ "$ICON_ALPHA" == "no" ]]

      - name: Choose simulator
        id: simulator
        shell: bash
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime in data.values() for d in runtime if d.get("isAvailable") and "iPhone" in d.get("name", "")))')"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: iOS app and widget tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project iOS/DrawerMobile.xcodeproj \
            -scheme DrawerMobile \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee xcodebuild.log
          STATUS=${PIPESTATUS[0]}

          if [[ $STATUS -ne 0 ]]; then
            {
              echo "## Xcode diagnostics"
              echo '```text'
              grep -E "(^|[[:space:]])(error:|fatal error:)|warning:.*will be an error|The following build commands failed" xcodebuild.log | tail -n 120 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit $STATUS

      - name: Release build smoke test
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project iOS/DrawerMobile.xcodeproj \
            -scheme DrawerMobile \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild-release.log
          STATUS=${PIPESTATUS[0]}

          if [[ $STATUS -ne 0 ]]; then
            {
              echo "## Release build diagnostics"
              echo '```text'
              grep -E "(^|[[:space:]])(error:|fatal error:)|warning:.*will be an error|The following build commands failed" xcodebuild-release.log | tail -n 120 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit $STATUS
